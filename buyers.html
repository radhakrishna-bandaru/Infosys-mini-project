<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyers — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="buyers-template">
  <div class="reveal">
    <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:26px;">All Buyers</h1>
        <p class="text-muted text-sm mt-8">Browse every buyer on the Smart Farmer network.</p>
      </div>
      <select id="buyers-filter-crop" style="border:1.5px solid var(--paper-200);border-radius:10px;padding:10px 14px;">
        <option value="">All crops</option>
      </select>
    </div>
    <div class="grid-3 mt-24" id="buyers-directory-list"></div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/buyers.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("sell", "Buyers");
  document.getElementById("app-main-content").innerHTML = document.getElementById("buyers-template").innerHTML;
  sfInitBuyersDirectory();
</script>
</body>
</html>
