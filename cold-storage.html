<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Storage Finder — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="storage-template">
  <div class="reveal">
    <h1 style="font-size:26px;">Find Cold Storage Near You</h1>
    <p class="text-muted text-sm mt-8">Compare facilities by price, capacity, distance and rating.</p>

    <div class="card shadow-card mt-24">
      <div class="field" style="margin-bottom:16px;">
        <input type="text" id="storage-search" placeholder="🔍 Search by crop, location or storage name…" style="padding:14px 16px;border-radius:12px;border:1.5px solid var(--paper-200);width:100%;font-size:15px;">
      </div>
      <div class="grid-4">
        <div class="field" style="margin:0;"><label>Crop</label><select id="filter-crop"><option value="">Any crop</option></select></div>
        <div class="field" style="margin:0;"><label>Max Distance (km)</label><input type="number" id="filter-distance" placeholder="Any"></div>
        <div class="field" style="margin:0;"><label>Max Price (₹/kg/day)</label><input type="number" id="filter-price" placeholder="Any" step="0.1"></div>
        <div class="field" style="margin:0;"><label>Min Rating</label>
          <select id="filter-rating"><option value="">Any</option><option value="4.5">4.5+</option><option value="4">4+</option><option value="3.5">3.5+</option></select>
        </div>
      </div>
      <div class="flex-between mt-16">
        <span class="text-sm text-muted" id="storage-count"></span>
        <select id="filter-sort" style="border:1.5px solid var(--paper-200);border-radius:10px;padding:8px 12px;font-size:13.5px;">
          <option value="distance">Sort: Nearest</option>
          <option value="price">Sort: Lowest Price</option>
          <option value="rating">Sort: Highest Rated</option>
        </select>
      </div>
    </div>

    <div class="grid-3 mt-24" id="storage-list"></div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("storage", "Cold Storage");
  document.getElementById("app-main-content").innerHTML = document.getElementById("storage-template").innerHTML;
  sfInitStorageFilters();
</script>
</body>
</html>
