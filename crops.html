<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Crops — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="crops-template">
  <div class="reveal">
    <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:26px;">My Crops</h1>
        <p class="text-muted text-sm mt-8">Manage your harvest and see live value estimates.</p>
      </div>
      <button class="btn btn-primary" onclick="sfOpenModal('add-crop-modal')"><i class="bi bi-plus-lg"></i> Add New Crop</button>
    </div>

    <div id="crops-empty" class="card mt-32" style="display:none;text-align:center;padding:60px 20px;">
      <div style="font-size:40px;">🌱</div>
      <h3 class="mt-16">No crops added yet</h3>
      <p class="text-muted text-sm mt-8">Add your first crop to get storage suggestions, market prices and buyer matches.</p>
      <button class="btn btn-primary mt-16" onclick="sfOpenModal('add-crop-modal')">Add New Crop</button>
    </div>

    <div class="grid-3 mt-32" id="crops-grid"></div>
  </div>
</template>

<!-- Add Crop Modal -->
<div class="modal-overlay" id="add-crop-modal">
  <div class="modal">
    <div class="modal-head">
      <h3 style="font-size:20px;">Add New Crop</h3>
      <button class="modal-close" onclick="sfCloseModal('add-crop-modal')"><i class="bi bi-x-lg"></i></button>
    </div>
    <form id="add-crop-form">
      <div class="field"><label for="new-crop-name">Crop Name</label><select id="new-crop-name" required></select></div>
      <div class="field"><label for="new-crop-variety">Variety</label><input type="text" id="new-crop-variety" placeholder="e.g. Hybrid Vigor"></div>
      <div class="field-row">
        <div class="field"><label for="new-crop-qty">Quantity (KG)</label><input type="number" id="new-crop-qty" placeholder="5000" required min="1"></div>
        <div class="field"><label for="new-crop-quality">Quality</label>
          <select id="new-crop-quality"><option>Grade A</option><option>Grade B</option><option>Grade C</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label for="new-crop-harvest">Harvest Date</label><input type="date" id="new-crop-harvest"></div>
        <div class="field"><label for="new-crop-sellby">Expected Selling Date</label><input type="date" id="new-crop-sellby"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-8">Add Crop</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/crops.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("crops", "My Crops");
  document.getElementById("app-main-content").innerHTML = document.getElementById("crops-template").innerHTML;
  sfInitCropsPage();
</script>
</body>
</html>
