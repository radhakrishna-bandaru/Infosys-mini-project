<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark">🌾</span>Smart Farmer</a>
    <a href="index.html" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Back home</a>
  </div>
</header>

<main class="flex-center" style="flex:1;padding:40px 16px;">
  <div class="card shadow-card" style="width:420px;max-width:100%;padding:34px;">
    <div class="eyebrow">Welcome back</div>
    <h1 style="font-size:28px;">Log in to your account</h1>
    <p class="text-muted text-sm mt-8">Access your crops, storage bookings and market insights.</p>

    <div class="flex gap-8 mt-24" role="tablist">
      <button class="chip active" id="tab-farmerid" role="tab" style="flex:1;">Farmer ID</button>
      <button class="chip" id="tab-mobile" role="tab" style="flex:1;">Mobile Number</button>
    </div>

    <form id="login-form" class="mt-24">
      <div id="panel-farmerid">
        <div class="field">
          <label for="farmer-id">Farmer ID</label>
          <input type="text" id="farmer-id" placeholder="SF2026001" value="SF2026001" autocomplete="username">
        </div>
      </div>
      <div id="panel-mobile" style="display:none;">
        <div class="field">
          <label for="mobile-num">Mobile Number</label>
          <input type="tel" id="mobile-num" placeholder="98765 43210" autocomplete="tel">
        </div>
      </div>

      <div class="field">
        <label for="password">Password / PIN</label>
        <input type="password" id="password" placeholder="••••••" value="123456" autocomplete="current-password">
      </div>

      <div class="flex-between mb-16">
        <label class="checkbox-row"><input type="checkbox" id="remember-me"> Remember me</label>
        <a href="#" class="text-sm" style="color:var(--forest-700);font-weight:600;">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block"><i class="bi bi-box-arrow-in-right"></i> Login</button>
      <button type="button" class="btn btn-outline btn-block mt-8" onclick="document.getElementById('login-form').requestSubmit()"><i class="bi bi-person-badge"></i> Login with Farmer ID</button>
    </form>

    <p class="text-sm text-muted mt-24" style="text-align:center;">New here? <a href="register.html" style="color:var(--forest-700);font-weight:600;">Create Account</a></p>
    <p class="text-sm text-muted mt-16" style="text-align:center;background:var(--paper-100);padding:10px;border-radius:10px;"><i class="bi bi-info-circle"></i> Demo only — any credentials will log you in. Not production-secure.</p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/voice-assistant.js"></script>
<script>sfInitLoginPage();</script>
</body>
</html>
