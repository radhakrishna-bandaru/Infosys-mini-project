<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="map-template">
  <div class="reveal">
    <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
      <div>
        <h1 style="font-size:26px;">Map</h1>
        <p class="text-muted text-sm mt-8">Cold storages, buyers and your location, all in one view.</p>
      </div>
      <div class="flex gap-12" style="align-items:center;flex-wrap:wrap;">
        <label class="chip flex gap-8" style="align-items:center;"><input type="checkbox" id="layer-storage" class="map-layer-toggle" checked> ❄️ Storage</label>
        <label class="chip flex gap-8" style="align-items:center;"><input type="checkbox" id="layer-buyers" class="map-layer-toggle" checked> 🤝 Buyers</label>
        <button class="btn btn-outline btn-sm" id="map-locate-btn"><i class="bi bi-geo"></i> Use my location</button>
      </div>
    </div>
    <div class="card shadow-card mt-24" style="padding:0;overflow:hidden;">
      <div id="sf-map" style="height:560px;width:100%;"></div>
    </div>
  </div>
</template>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/map.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("map", "Map");
  document.getElementById("app-main-content").innerHTML = document.getElementById("map-template").innerHTML;
  sfInitMap();
</script>
</body>
</html>
