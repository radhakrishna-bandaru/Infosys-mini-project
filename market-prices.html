<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Prices — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="market-template">
  <div class="reveal">
    <h1 style="font-size:26px;">Market Price Dashboard</h1>
    <p class="text-muted text-sm mt-8">Live crop prices across Indian mandis.</p>

    <div class="card shadow-card mt-24">
      <div class="grid-2">
        <div class="field" style="margin:0;"><label>Crop</label><select id="market-filter-crop"><option value="">All crops</option></select></div>
        <div class="field" style="margin:0;"><label>State</label><select id="market-filter-state"><option value="">All states</option></select></div>
      </div>
    </div>

    <div class="grid-3 mt-24" id="market-cards"></div>

    <div class="card shadow-card mt-32" id="chart-section">
      <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
        <h2 id="chart-title" style="font-size:19px;">Price Trend</h2>
        <div class="flex gap-12" style="align-items:center;flex-wrap:wrap;">
          <select id="chart-crop-select" style="border:1.5px solid var(--paper-200);border-radius:10px;padding:8px 12px;"></select>
          <div class="flex gap-6">
            <label class="chip"><input type="radio" name="chart-range" value="7d" checked style="margin-right:6px;">7 Day</label>
            <label class="chip"><input type="radio" name="chart-range" value="30d" style="margin-right:6px;">30 Day</label>
            <label class="chip"><input type="radio" name="chart-range" value="90d" style="margin-right:6px;">3 Month</label>
          </div>
        </div>
      </div>
      <div style="height:320px;margin-top:20px;">
        <canvas id="price-chart"></canvas>
      </div>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/market.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("market", "Market Prices");
  document.getElementById("app-main-content").innerHTML = document.getElementById("market-template").innerHTML;
  sfInitMarketPage();
</script>
</body>
</html>
