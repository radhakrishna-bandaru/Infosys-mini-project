<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="notif-template">
  <div class="reveal">
    <div class="flex-between" style="flex-wrap:wrap;gap:12px;">
      <h1 style="font-size:26px;">Notifications</h1>
      <button class="btn btn-outline btn-sm" id="mark-all-read-btn">Mark all as read</button>
    </div>
    <div class="mt-24" style="display:flex;flex-direction:column;gap:12px;" id="notif-list"></div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/notifications.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("notifications", "Notifications");
  document.getElementById("app-main-content").innerHTML = document.getElementById("notif-template").innerHTML;
  sfInitNotifications();
</script>
</body>
</html>
