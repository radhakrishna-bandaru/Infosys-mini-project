<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><span class="brand-mark">🌾</span>Smart Farmer</a>
    <a href="login.html" class="btn btn-ghost"><i class="bi bi-arrow-left"></i> Back to login</a>
  </div>
</header>

<main class="flex-center" style="flex:1;padding:40px 16px;">
  <div class="card shadow-card" style="width:560px;max-width:100%;padding:34px;">
    <div class="eyebrow">Join Smart Farmer</div>
    <h1 style="font-size:28px;">Create your account</h1>
    <p class="text-muted text-sm mt-8">Takes less than two minutes. All fields are used to personalise your dashboard.</p>

    <form id="register-form" class="mt-24">
      <div class="field-row">
        <div class="field"><label for="reg-name">Full Name</label><input type="text" id="reg-name" placeholder="Suryakiran Reddy" required></div>
        <div class="field"><label for="reg-farmerid">Farmer ID</label><input type="text" id="reg-farmerid" placeholder="SF2026002"></div>
      </div>

      <div class="field">
        <label for="reg-mobile">Mobile Number</label>
        <div class="flex gap-8">
          <input type="tel" id="reg-mobile" placeholder="98765 43210" style="flex:1;" required>
          <button type="button" id="send-otp-btn" class="btn btn-outline btn-sm">Send OTP</button>
        </div>
      </div>
      <div class="field" id="otp-row" style="display:none;">
        <label for="reg-otp">Enter OTP</label>
        <input type="text" id="reg-otp" placeholder="1234" maxlength="4">
        <span class="field-hint">Demo simulation — use 1234</span>
      </div>

      <div class="field"><label for="reg-email">Email</label><input type="email" id="reg-email" placeholder="you@example.com"></div>

      <div class="field-row">
        <div class="field"><label for="reg-village">Village</label><input type="text" id="reg-village" placeholder="Bowenpally" required></div>
        <div class="field"><label for="reg-district">District</label><input type="text" id="reg-district" placeholder="Hyderabad" required></div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="reg-state">State</label>
          <select id="reg-state" required>
            <option>Telangana</option><option>Andhra Pradesh</option><option>Karnataka</option><option>Tamil Nadu</option><option>Maharashtra</option><option>Punjab</option><option>Uttar Pradesh</option><option>Delhi</option><option>Gujarat</option><option>West Bengal</option>
          </select>
        </div>
        <div class="field">
          <label for="reg-language">Preferred Language</label>
          <select id="reg-language"></select>
        </div>
      </div>

      <div class="field">
        <label for="reg-crop">Main Crop</label>
        <select id="reg-crop"></select>
      </div>

      <div class="field-row">
        <div class="field"><label for="reg-password">Password</label><input type="password" id="reg-password" placeholder="••••••" required></div>
        <div class="field"><label for="reg-confirm">Confirm Password</label><input type="password" id="reg-confirm" placeholder="••••••" required></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-8"><i class="bi bi-person-plus"></i> Create Account</button>
    </form>
    <p class="text-sm text-muted mt-24" style="text-align:center;">Already have an account? <a href="login.html" style="color:var(--forest-700);font-weight:600;">Log in</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  const langSel = document.getElementById("reg-language");
  SF_LANGUAGES.forEach(l=>{ const o=document.createElement("option"); o.value=l.label; o.textContent=l.native; langSel.appendChild(o); });
  const cropSel = document.getElementById("reg-crop");
  SF_DATA.cropCatalog.forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=(CROP_ICONS[c]||"🌱")+" "+c; cropSel.appendChild(o); });
  sfInitRegisterPage();
</script>
</body>
</html>
