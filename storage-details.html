<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storage Details — Smart Farmer</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body data-sf-page="app">

<div id="app-shell-root"></div>

<template id="details-template">
  <div class="reveal">
    <a href="cold-storage.html" class="text-sm" style="color:var(--forest-700);font-weight:600;"><i class="bi bi-arrow-left"></i> Back to search</a>

    <div class="card shadow-card mt-16" style="padding:0;overflow:hidden;">
      <img src="https://images.unsplash.com/photo-1601599963565-b7f49deb6d16?q=80&w=1200&auto=format&fit=crop" alt="Cold storage warehouse interior" loading="lazy" style="width:100%;height:260px;object-fit:cover;">
    </div>

    <div class="grid-2 mt-24" style="align-items:start;gap:32px;">
      <div>
        <h1 id="sd-name" style="font-size:26px;"></h1>
        <div id="sd-rating" class="text-sm mt-8"></div>
        <div class="text-sm text-muted mt-8"><i class="bi bi-geo-alt"></i> <span id="sd-address"></span></div>

        <div class="card mt-24">
          <div class="flex-between mb-8"><strong style="font-size:15px;">Space available</strong><span id="sd-avail-pct" class="text-sm text-muted"></span></div>
          <div class="progress-bar" id="sd-avail-bar"><span></span></div>
        </div>

        <div class="grid-2 mt-24" style="gap:14px;">
          <div class="card-flat"><div class="text-sm text-muted">Capacity</div><div style="font-weight:600;" id="sd-capacity"></div></div>
          <div class="card-flat"><div class="text-sm text-muted">Available</div><div style="font-weight:600;" id="sd-available"></div></div>
          <div class="card-flat"><div class="text-sm text-muted">Temperature</div><div style="font-weight:600;" id="sd-temp"></div></div>
          <div class="card-flat"><div class="text-sm text-muted">Humidity</div><div style="font-weight:600;" id="sd-humidity"></div></div>
          <div class="card-flat"><div class="text-sm text-muted">Security</div><div style="font-weight:600;" id="sd-security"></div></div>
          <div class="card-flat"><div class="text-sm text-muted">Power Backup</div><div style="font-weight:600;" id="sd-power"></div></div>
        </div>

        <h3 style="font-size:16px;margin-top:24px;">Supported crops</h3>
        <div class="flex gap-6 mt-8" style="flex-wrap:wrap;" id="sd-crops"></div>

        <h3 style="font-size:16px;margin-top:24px;">Reviews</h3>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;" id="sd-reviews"></div>
      </div>

      <div>
        <div class="card shadow-card" style="position:sticky;top:24px;">
          <div class="text-sm text-muted">Pricing</div>
          <div style="font-family:var(--font-display);font-size:26px;" id="sd-price"></div>
          <div class="flex gap-8 mt-16">
            <button id="sd-book-btn" class="btn btn-primary btn-block">Book Storage</button>
          </div>
          <a id="sd-navigate-btn" href="map.html" class="btn btn-outline btn-block mt-8">Navigate</a>

          <div class="divider"></div>
          <h3 style="font-size:16px;">💰 Storage Cost Calculator</h3>
          <div class="field"><label>Crop</label><select id="calc-crop"></select></div>
          <div class="field"><label>Quantity (KG)</label><input type="number" id="calc-qty" value="5000"></div>
          <div class="field"><label>Storage Duration (Days)</label><input type="number" id="calc-days" value="7"></div>
          <div class="field"><label>Price (₹/KG/Day)</label><input type="number" id="calc-price" step="0.1"></div>
          <div class="card-flat" style="text-align:center;padding:16px;">
            <div class="text-sm text-muted">Estimated Cost</div>
            <div style="font-family:var(--font-display);font-size:28px;color:var(--forest-700);" id="calc-result">₹0</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/voice-assistant.js"></script>
<script>
  sfRequireAuth();
  sfBuildAppShell("storage", "Storage Details");
  document.getElementById("app-main-content").innerHTML = document.getElementById("details-template").innerHTML;
  sfInitStorageDetails();
</script>
</body>
</html>
